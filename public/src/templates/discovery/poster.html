<!doctype html>
<!-- BM Discovery 海报 — Figma 节点 62:4317。
     双画布：pop 1200×1200 / web 1200×600。
     层序：模糊左岩 < 右岩（含金属圈）< 币面+光效 < 前景岩（压住币下缘）< 文字。
     设计稿的 Vector 遮罩略去——前景岩本来就叠在币上，视觉等价。
     币面（coin.png）整圆可替换。logo 行带「BM Discovery」徽标文字（可直编）。 -->
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('../../../assets/fonts/poppins.css');
  @import url('../../../assets/fonts/harmony.css');
  @import url('../../../assets/fonts/alexandria.css'); /* 徽标文字用 Alexandria */

  html, body { margin: 0; overflow: hidden; }
  body { background: #000; }
  body.size-pop { width: 400px; height: 400px; }
  body.size-web { width: 400px; height: 200px; }
  [data-edit] { outline: none; }

  .stage {
    position: relative; width: 1200px; zoom: calc(1 / 3);
    background: #000; overflow: hidden;
    font-family: 'Poppins', 'HarmonyOS Sans SC', sans-serif;
    color: #fff;
  }
  body.size-pop .stage { height: 1200px; }
  body.size-web .stage { height: 600px; }

  .abs { position: absolute; }
  .photo { pointer-events: none; } /* 前景岩石盖住币面，别挡点击上传的手型 */
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .coin { border-radius: 50%; overflow: hidden; }
  .coin img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .glow { mix-blend-mode: plus-lighter; pointer-events: none; } /* 光晕盖在币上，别挡点击上传 */
  .glow img { width: 100%; height: 100%; display: block; }

  .logorow { display: flex; align-items: center; gap: 45px; }
  .logorow .logo { display: flex; align-items: center; height: 100%; }
  .logorow .logo img { display: block; height: 100%; aspect-ratio: 43.61 / 50; }
  .logorow .logo .word { height: 57%; aspect-ratio: 147.69 / 28.59; margin-left: 11px; }
  .logorow .badge { font-family: 'Alexandria', sans-serif; font-weight: 400; line-height: 1.28;
                    white-space: nowrap; }

  .cname { display: flex; flex-direction: column; gap: 32px; }
  .cname .big { font-weight: 700; line-height: 0.9; color: #fff; overflow-wrap: break-word;
                text-box: trim-both cap alphabetic; }
  .cname .small { font-weight: 400; line-height: 1; color: #01e0e0; overflow-wrap: break-word;
                  text-box: trim-both cap alphabetic; }

  .timerow { display: flex; align-items: center; gap: 16px; }
  .timerow img { width: 24px; height: 24px; display: block; }
  .timerow .t { font-weight: 400; line-height: 1; white-space: nowrap; }

  .subtitle { line-height: 1.28; }
</style>
</head>
<body>
  <div class="stage" id="stage"></div>

<script src="../../shared/time.js"></script>
<script>
const A = '../../../assets/discovery/';
const SHARED = '../../../assets/listing/figma/_shared/';

const LAYOUTS = {
  pop: {
    rocksL: { src: 'rocks-left-pop.png', x: -29, y: 447, w: 773, h: 819, blur: 13.45 },
    rocksR: { src: 'rocks-right-pop.png', x: 468, y: 428, w: 828, h: 778 },
    coin: { x: 577, y: 484, d: 455 },
    glow: { x: 574, y: 483, w: 459, h: 463 },
    front: { src: 'rocks-front-pop.png', w: 828, h: 592 },
    cname: { x: 64, y: 203, w: 1072, big: 106, small: 56 },
    time: { x: 64, y: 428, size: 30 },
    subtitle: { x: 64, bottom: 64, w: 706, size: 44, weight: 400, lh: 1.28 },
    logorow: { x: 64, y: 64, h: 48, badge: 36 },
  },
  web: {
    rocksL: { src: 'rocks-left-web.png', x: -23, y: 217, w: 484, h: 513, blur: 13.45 },
    rocksR: { src: 'rocks-right-web.png', x: 665, y: 152, w: 560, h: 526 },
    coin: { x: 739, y: 190, d: 307 },
    glow: { x: 737, y: 189, w: 310, h: 313 },
    front: { src: 'rocks-front-web.png', w: 510, h: 313 },
    cname: { x: 60, y: 80, w: 814, big: 88, small: 30 },
    time: { x: 64, y: 237, size: 26 },
    subtitle: { x: 60, bottom: 159, w: 520, size: 30, weight: 300, lh: 1.04 },
    logorow: { x: 60, bottom: 70, h: 45, badge: 30 },
  },
};

window.renderPoster = function (d) {
  const size = document.body.className.replace('size-', '') || 'pop';
  const L = LAYOUTS[size];
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const el = (cls, style, html) => {
    const n = document.createElement('div');
    n.className = cls;
    Object.assign(n.style, style);
    if (html !== undefined) n.innerHTML = html;
    stage.appendChild(n);
    return n;
  };
  const px = (v) => v + 'px';

  el('photo abs', {
    left: px(L.rocksL.x), top: px(L.rocksL.y), width: px(L.rocksL.w), height: px(L.rocksL.h),
    filter: `blur(${L.rocksL.blur}px)`,
  }, `<img src="${A}${L.rocksL.src}">`);
  el('photo abs', { left: px(L.rocksR.x), top: px(L.rocksR.y), width: px(L.rocksR.w), height: px(L.rocksR.h) },
    `<img src="${A}${L.rocksR.src}">`);

  const coin = el('coin abs', { left: px(L.coin.x), top: px(L.coin.y), width: px(L.coin.d), height: px(L.coin.d) });
  coin.dataset.editImage = 'coinIcon';
  coin.innerHTML = `<img src="${d.coinIcon || A + 'coin.png'}">`;
  el('glow abs', { left: px(L.glow.x), top: px(L.glow.y), width: px(L.glow.w), height: px(L.glow.h) },
    `<img src="${A}glow.svg">`);

  el('photo abs', { right: '0', bottom: '0', width: px(L.front.w), height: px(L.front.h) },
    `<img src="${A}${L.front.src}">`);

  const nm = el('cname abs', { left: px(L.cname.x), top: px(L.cname.y), width: px(L.cname.w) },
    `<div class="big" data-edit="name" style="font-size:${L.cname.big}px"></div>
     <div class="small" data-edit="ticker" style="font-size:${L.cname.small}px"></div>`);
  nm.querySelector('.big').innerText = d.name;
  nm.querySelector('.small').innerText = d.ticker;

  const time = el('timerow abs', { left: px(L.time.x), top: px(L.time.y) },
    `<img src="${SHARED}calendar.svg"><span class="t" style="font-size:${L.time.size}px"></span>`);
  time.querySelector('.t').textContent = PosterTime.display(d.datetimeUtc, d.lang);

  const sub = el('subtitle abs', {
    left: px(L.subtitle.x), bottom: px(L.subtitle.bottom), width: px(L.subtitle.w),
    fontSize: px(L.subtitle.size), fontWeight: L.subtitle.weight, lineHeight: String(L.subtitle.lh),
  });
  sub.dataset.edit = 'subtitle';
  sub.innerText = d.subtitle;

  const rowStyle = { left: px(L.logorow.x), height: px(L.logorow.h) };
  if (L.logorow.bottom !== undefined) rowStyle.bottom = px(L.logorow.bottom);
  else rowStyle.top = px(L.logorow.y);
  const row = el('logorow abs', rowStyle,
    `<div class="logo"><img src="${SHARED}logo-icon.svg"><img class="word" src="${SHARED}logo-word.svg"></div>
     <div class="badge" data-edit="badge" style="font-size:${L.logorow.badge}px"></div>`);
  row.querySelector('.badge').innerText = d.badge;
};
</script>
<script src="../_shared/poster-kit.js"></script>
</body>
</html>
