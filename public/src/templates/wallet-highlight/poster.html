<!doctype html>
<!-- Wallet 亮点海报 — 按 Figma 稿 5MfOHRZJyeSfFbwSLRzUEv 节点 1577:14895（CN）/ 1580:15771（EN）/ 1580:15787（TW）制作。
     画布 1200×1200：stage 按设计 px 排版，zoom 1/3 落到 400×400 视口（@3x 导出回 1200）。
     手机样机固定：壳图（507×1041）盖在截图上层且 pointer-events:none，
     点击命中的是下层截图槽（464×1003 圆角 58.74，data-edit-image），只换屏幕内容不动壳。
     排版分两套：EN 走 Switzer，zh-CN / zh-TW 走 HarmonyOS Sans SC（字号/字距/组间距均按稿）。 -->
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('../../../assets/fonts/switzer.css');
  @import url('../../../assets/fonts/harmony.css');

  html, body { margin: 0; overflow: hidden; } /* headless Chrome 滚动条会占视口（KOL 教训） */
  body { width: 400px; height: 400px; background: #fff; }
  [data-edit] { outline: none; }
  .stage {
    position: relative; width: 1200px; height: 1200px; zoom: calc(1 / 3);
    background: #fff; overflow: hidden; color: #000;
  }

  /* 背景绿色装饰（SVG，含圆环镂空），越界部分由 stage 裁切 */
  .bg { position: absolute; left: -133px; top: -4px; width: 1967.81px; height: 1518.46px; }

  .title-block { position: absolute; left: 64px; top: 64px; width: 1072px; display: flex; flex-direction: column; }
  .title, .subtitle { width: 100%; }
  .lang-en .title-block { gap: 32px; }
  .lang-en .title {
    font-family: 'Switzer', 'HarmonyOS Sans SC', sans-serif; font-weight: 700;
    font-size: 144px; line-height: 0.96; letter-spacing: -2.88px; text-transform: capitalize;
  }
  .lang-en .subtitle {
    font-family: 'Switzer', 'HarmonyOS Sans SC', sans-serif; font-weight: 400;
    font-size: 40px; line-height: 1.4; letter-spacing: -0.8px;
  }
  .lang-cn .title-block { gap: 24px; }
  .lang-cn .title {
    font-family: 'HarmonyOS Sans SC', sans-serif; font-weight: 900;
    font-size: 188px; line-height: 1.1; letter-spacing: -3.76px;
  }
  .lang-cn .subtitle {
    font-family: 'HarmonyOS Sans SC', sans-serif; font-weight: 400;
    font-size: 44px; line-height: 1.4; letter-spacing: -0.88px;
  }

  /* 手机样机：截图槽在下（可点上传），壳图在上（不吃点击） */
  .phone { position: absolute; left: 620px; top: 393px; width: 507px; height: 1041px; }
  .shot {
    position: absolute; left: 22px; top: 18px; width: 464px; height: 1003px;
    border-radius: 58.74px; overflow: hidden;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame { position: absolute; inset: 0; width: 507px; height: 1041px; pointer-events: none; }

  .logo { position: absolute; left: 64px; top: 1072px; width: 372.8px; height: 64px; }
</style>
</head>
<body>
<div class="stage lang-en" id="stage">
  <img class="bg" src="../../../assets/wallet/hl-bg.svg" alt="">

  <div class="title-block">
    <div class="title" data-edit="title"></div>
    <div class="subtitle" data-edit="subtitle"></div>
  </div>

  <div class="phone">
    <div class="shot" data-edit-image="screenshot"><img id="shot-img" src="../../../assets/wallet/hl-shot.jpg" alt=""></div>
    <img class="frame" src="../../../assets/wallet/hl-phone.png" alt="">
  </div>

  <img class="logo" src="../../../assets/wallet/hl-logo.svg" alt="">
</div>

<script>
window.renderPoster = function (d) {
  const cn = d.lang === 'zh-CN' || d.lang === 'zh-TW';
  document.getElementById('stage').className = 'stage ' + (cn ? 'lang-cn' : 'lang-en');
  document.querySelector('[data-edit="title"]').innerText = d.title;
  document.querySelector('[data-edit="subtitle"]').innerText = d.subtitle;
  // 截图：上传的 data URL 优先，否则内置 Predictions 页截图
  document.getElementById('shot-img').src = d.screenshot || '../../../assets/wallet/hl-shot.jpg';
};
</script>
<script src="../_shared/poster-kit.js"></script>
</body>
</html>
